services:
  - type: web
    name: safezon-hd
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VIGICARE_YOLO_MODEL
        value: yolov8x-pose.pt
